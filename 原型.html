<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半导体运营管理系统 · 时刻原型</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1f2733; --ink2:#5b6573; --ink3:#8a93a2;
    --line:#e6eaf0; --line2:#eef1f6; --brand:#2563eb; --brand-ink:#fff;
    --ok:#15a36a; --okbg:#e7f6ee; --warn:#d97706; --warnbg:#fdf2e0;
    --danger:#dc2626; --dangerbg:#fde8e8; --info:#0e7490; --infobg:#e2f3f7;
    --purple:#7c3aed; --purplebg:#f0eafe;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
    --shadow-lg:0 10px 30px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer}
  /* layout */
  .app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;height:100vh;grid-template-areas:"side top" "side main";}
  .topbar{grid-area:top;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;}
  .side{grid-area:side;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;padding:14px 0;overflow:auto;}
  .main{grid-area:main;overflow:auto;padding:22px 26px;}
  /* sidebar */
  .brand{padding:4px 18px 14px;font-weight:700;color:#fff;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.18)}
  .navgroup{padding:6px 12px;}
  .navlabel{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;padding:8px 8px 4px;}
  .navitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:#cbd5e1;font-size:13.5px;margin:2px 0;}
  .navitem:hover{background:#1e293b;color:#fff}
  .navitem.active{background:var(--brand);color:#fff;font-weight:600}
  .navitem .badge{font-size:11px;background:#ef4444;color:#fff;border-radius:10px;padding:0 6px;min-width:18px;text-align:center;height:18px;line-height:18px}
  .navitem.active .badge{background:rgba(255,255,255,.28)}
  .roleselect{margin:2px 12px 8px;}
  .roleselect select{width:100%;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:13.5px}
  /* topbar */
  .crumb{font-weight:650;font-size:16px}
  .crumb small{color:var(--ink3);font-weight:400;font-size:13px;margin-left:8px}
  .spacer{flex:1}
  .bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:17px;display:flex;align-items:center;justify-content:center}
  .bell .count{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:11px;border-radius:10px;padding:0 5px;min-width:17px;height:17px;line-height:17px;text-align:center}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
  .btn:hover{border-color:#cbd5e1;background:#fafbfc}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#1d4ed8}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* page */
  .pagehead{margin:0 0 16px}
  .pagehead h1{font-size:20px;margin:0 0 4px}
  .pagehead p{margin:0;color:var(--ink2);font-size:13.5px}
  .toolbar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;background:#eef1f6;padding:4px;border-radius:10px}
  .tab{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--ink2);border:none;background:transparent}
  .tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  /* card / list */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line2);}
  .row:last-child{border-bottom:none}
  .row.pinned{background:linear-gradient(90deg,#fff7ed, #fff 60%);}
  .row .grow{flex:1;min-width:0}
  .row .title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  .row .sub{color:var(--ink3);font-size:12.5px;margin-top:2px}
  .row .actions{display:flex;gap:7px;flex-shrink:0}
  .clickable{cursor:pointer}
  .clickable:hover{background:#f8fafc}
  /* badges */
  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .t-ok{background:var(--okbg);color:var(--ok)} .t-warn{background:var(--warnbg);color:var(--warn)}
  .t-danger{background:var(--dangerbg);color:var(--danger)} .t-info{background:var(--infobg);color:var(--info)}
  .t-purple{background:var(--purplebg);color:var(--purple)} .t-gray{background:#eef1f6;color:var(--ink2)}
  .t-brand{background:#e6efff;color:var(--brand)}
  .sev{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sev.high{background:#dc2626} .sev.mid{background:#d97706} .sev.low{background:#16a34a}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{padding:16px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:700} .stat .l{color:var(--ink3);font-size:12.5px;margin-top:2px}
  .empty{padding:40px;text-align:center;color:var(--ink3);}
  .muted{color:var(--ink3)}
  .kv{display:flex;gap:8px;font-size:13px;margin:6px 0}
  .kv b{color:var(--ink2);font-weight:600;min-width:78px;display:inline-block}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;z-index:40}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100vh;background:#fff;box-shadow:var(--shadow-lg);z-index:50;transition:right .22s ease;display:flex;flex-direction:column}
  .drawer.open{right:0}
  .drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
  .drawer header h2{margin:0;font-size:17px}
  .drawer .body{padding:18px 20px;overflow:auto;flex:1}
  .drawer .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fafbfc}
  .x{margin-left:auto;border:none;background:transparent;font-size:20px;color:var(--ink3);cursor:pointer}
  .sec{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
  /* drawer 分页签 + 富详情区块 */
  .dtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0}
  .dtabs .tab{border-radius:0;background:transparent;box-shadow:none;border-bottom:2px solid transparent;padding:11px 13px;color:var(--ink2)}
  .dtabs .tab.active{background:transparent;box-shadow:none;color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
  .prose{font-size:13px;color:var(--ink2);line-height:1.65;margin:2px 0 4px}
  .cmt{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line2)}
  .cmt:last-child{border-bottom:none}
  .cmt .av{width:26px;height:26px;border-radius:50%;background:#e6efff;color:var(--brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cmt .who{font-weight:600;font-size:12.5px}
  .cmt .txt{font-size:12.5px;color:var(--ink2);margin-top:1px}
  .cmt .ts{font-size:11px;color:var(--ink3);margin-top:1px}
  .filerow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13px}
  .filerow:last-child{border-bottom:none}
  /* timeline */
  .tl{position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl .ev{position:relative;padding:0 0 16px}
  .tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
  .tl .ev.decision::before{border-color:var(--purple)}
  .tl .ev .t{font-weight:600;font-size:13px}
  .tl .ev .m{color:var(--ink2);font-size:12.5px}
  .tl .ev .ts{color:var(--ink3);font-size:11.5px;margin-top:1px}
  /* approval chain */
  .chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chain .node{padding:4px 10px;border-radius:20px;background:#eef1f6;font-size:12.5px;color:var(--ink2)}
  .chain .node.done{background:var(--okbg);color:var(--ok)}
  .chain .node.cur{background:var(--brand);color:#fff;font-weight:600}
  .chain .arr{color:var(--ink3)}
  textarea,input,select.fld{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .flash{animation:flash 1.6s ease}
  @keyframes flash{0%,40%{background:#fff7cc}100%{background:transparent}}
  .hint{background:#f0f6ff;border:1px solid #d6e4ff;color:#1e40af;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;padding:10px 14px;color:var(--ink3);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
  .tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tr.clickable:hover{background:#f8fafc}
  .mono{font-family:ui-monospace,"Consolas",monospace;color:var(--ink2)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span>工艺运营 · 时刻台</div>
    <div class="navlabel">当前角色</div>
    <div class="roleselect">
      <select id="roleSel" onchange="setRole(this.value)">
        <option value="工程师">工程师</option>
        <option value="审批经理">审批经理</option>
        <option value="会议主持人">会议主持人</option>
        <option value="管理员">管理员</option>
      </select>
    </div>
    <div id="nav"></div>
  </aside>

  <header class="topbar">
    <div class="crumb" id="crumb">分诊收件箱</div>
    <div class="spacer"></div>
    <button class="bell" onclick="go('通知中心')" title="通知中心">🔔<span class="count" id="bellCount">0</span></button>
    <button class="btn ghost sm" onclick="resetAll()" title="清空并回到初始 mock 数据">↺ 重置数据</button>
  </header>

  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   规则层（硬编码，对齐领域模型决策 #3/#4/#5）
   ============================================================ */
const RULES = {
  SLA_HOURS: 24,                         // Issue 创建后 24h 为 SLA 截止
  // 审批阶梯（引用数据，管理员可改）：从直接主管逐级向上
  approvalLadder: ["三级经理","四级经理","五级经理"],
  // site → 站点负责人 注册表（本系统自有引用数据，管理员可改）
  siteOwners: { "Fab2-CMP":"李工", "Fab2-Etch":"王工", "Fab3-Litho":"赵工", "Fab3-Diff":"陈工" },
  // 决策 #9 · 因子层硬编码规则（先粗后细，对齐决策 #3 不做配置 UI）
  // Kanban 自动判定：受影响批次中任一 lot.priority==0（hot lot）→ Kanban
  isKanbanAuto: (iss)=> (iss.affectedLots||[]).some(l=>l.priority===0),
  // Risk 自动判定：按 params 越限数粗映射（高 ≥2 越限；中 1；其余 低）
  riskAuto: (iss)=>{
    const off = (iss.params||[]).filter(p=> p.status && p.status!=="正常").length;
    if(off>=2) return "高";
    if(off>=1) return "中";
    return "低";
  },
  // 必须上会（派生层，不可独立覆盖）= Kanban ∧ (∃lot subType∈{A,AA,AE}) ∧ (chart=KIP ∨ (chart=ACP ∧ risk∈{中,高}))
  mustGoToMeeting: (iss)=>{
    if(!iss.kanban) return false;
    const subOK = (iss.affectedLots||[]).some(l=>["A","AA","AE"].includes(l.subType));
    if(!subOK) return false;
    if(iss.chartLevel==="KIP") return true;
    if(iss.chartLevel==="ACP" && ["中","高"].includes(iss.risk)) return true;
    return false;
  }
};
// 模拟"现在"：以一个固定基准 + 自创建以来的相对小时推进。原型用 NOW_BASE 充当当前时刻。
let CLOCK = 0; // 小时偏移，可在接入健康里"快进时间"演示超时
const BASE_DATE = new Date(2026, 5, 3, 9, 0); // 2026-06-03 09:00（周三）作为"今天 09:00"基准
const WEEKDAY_ZH = ["日","一","二","三","四","五","六"];

/* 决策 #10 · 诊断字段（受控枚举，硬编码，呼应决策 #3 不做配置 UI）。
   命名前缀 `diagnosis_*` 表明这是「工程师对 Issue 的诊断」，与上游事实字段、外部系统的 detection 字段区隔。 */
const DIAGNOSIS_SUBTYPES = ["工艺漂移","设备异常","物料批次","量测误差","软件配置","其他"];
/* 决策 #2 补 · Issue.source（事实字段，只读）：分诊升级 / 外部系统派单。
   工作台是所有 Issue 的家，不是分诊的下游。 */
const ISSUE_SOURCES = ["triage","external-MES","external-SPC"];

/* 决策 #7 · Meeting 类型枚举（硬编码，呼应决策 #3）。早会/晚会自动滚动建；专题/其他由主持人手动建。 */
const MEETING_TYPES = ["早会","晚会","专题","其他"];

/* ============================================================
   日期 / 排期助手（决策 #7 排期规则）
   ============================================================ */
function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtYMD(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekdayZh(d){ return "周"+WEEKDAY_ZH[d.getDay()]; }
function isSunday(d){ return d.getDay()===0; }
function todayDate(){ return dateOnly(BASE_DATE); }   // BASE_DATE 的日期部分
function nowDateTime(){ const d=new Date(BASE_DATE); d.setHours(d.getHours()+CLOCK); return d; }
/* 从 i.createdAt（相对 BASE_DATE 的小时数；负数=之前发生）算出绝对发生时间 */
function occurredAtOf(i){ return new Date(BASE_DATE.getTime() + (i.createdAt||0)*3600*1000); }
/* 相对日期标签：今日 / 明日 / 昨日 / 周X */
function relDateLabel(d){
  const today=todayDate(); const t=dateOnly(d);
  const diff=Math.round((t-today)/86400000);
  if(diff===0) return "今日";
  if(diff===1) return "明日";
  if(diff===-1) return "昨日";
  return weekdayZh(d);
}
function meetingLabel(m){
  if(!m) return "";
  return `${relDateLabel(m.date)} · ${m.type}（${fmtYMD(m.date)}）`;
}

/* 自动排期算法（决策 #7）：
   1) window_day = (occurredAt − 13h).date
   2) 目标 = window_day + 2 天 的 type=早会, status=待召开 的 Meeting
   3) 兜底：目标不存在/已开过 → 顺延到下一个未开早会
   返回匹配的 Meeting，或 null（无可用早会，落「待排期」） */
function findAutoMeeting(occurredAt){
  const t=new Date(occurredAt); t.setHours(t.getHours()-13);
  const target=dateOnly(addDays(t, 2));
  const all=store.meetings.filter(m=>m.type==="早会" && m.status==="待召开");
  // 先尝试精确命中
  const exact=all.find(m=>+dateOnly(m.date)===+target);
  if(exact) return exact;
  // 顺延：所有 ≥ target 的待召开早会，按日期升序取第一个
  const future=all.filter(m=>+dateOnly(m.date)>+target).sort((a,b)=>+a.date - +b.date);
  return future[0] || null;
}

/* 自动建未来 N 天的早/晚会（周一至六，跳周日；不存时分；约定 "今天" 之前的标 已开） */
function autoBuildMeetings(){
  const out=[]; const today=todayDate();
  // 前 5 天（已开） + 后 14 天（待召开）
  for(let off=-5; off<=14; off++){
    const d=addDays(today, off);
    if(isSunday(d)) continue;
    const past = off<0;
    const ymd = fmtYMD(d);
    ["早会","晚会"].forEach(type=>{
      out.push({
        id: `M-${type==="早会"?"AM":"PM"}-${ymd}`,
        date: d, type,
        status: past ? "已开" : "待召开",
        title: `${weekdayZh(d)} · ${type}`,
        agenda: []
      });
    });
  }
  return out;
}

/* ============================================================
   状态层 store（单一可变对象）+ 初始 mock
   ============================================================ */
let store, seq;
function seed(){
  seq = { issue:1000, topic:500, reportDoc:700, event:1, notif:1 };
  // 告警 id 生成器：必须在 store 字面量之前声明，否则 TDZ/提升会导致 id 重复
  let alarmN = 2300;
  const a = (site,type,sev,h)=>({ id:"AL-"+(++alarmN), site, type, severity:sev, hAgo:h, status:"未分诊" });
  store = {
    role: "工程师",
    view: "分诊收件箱",
    detailIssueId: null,   // 当前整页详情查看的 Issue
    detailReturn: null,    // 从哪个视图进入整页（返回用）
    drawerIssueId: null,   // 抽屉当前显示的 Issue（用于异步动作后同步重绘抽屉）
    drawerTab: null,       // 抽屉当前 tab
    alarms: [
      a("Fab2-CMP","研磨头压力越限","high",-2),
      a("Fab2-CMP","研磨头压力越限","high",-2),       // 同站同类→可聚合
      a("Fab3-Litho","曝光剂量漂移","mid",-5),
      a("Fab2-Etch","刻蚀腔体温度异常","high",-1),
      a("Fab3-Diff","炉管真空度偏低","low",-8),
    ],
    issues: [],   // 预置 Issue 在 store 赋值后再填充（mkIssue→ev 需要 store.log 已存在）
    topics: [],     // 决策 #7 · 议题（原 Report 概念改名）：Issue × Meeting 调度实例
    reportDocs: [], // 决策 #11 · 报告文档薄壳（1:1 Issue，外部权威源 url + 状态）
    meetings: autoBuildMeetings(),  // 决策 #7 · 系统按"周一至六 早/晚会"自动滚动建
    integrationSources: [
      { id:"SRC-MES", name:"MES 告警流", status:"ok", lastSync:"刚刚" },
      { id:"SRC-FDC", name:"FDC 量测数据", status:"failed", lastSync:"43 分钟前", err:"连接超时：fdc-gw:8443 无响应" },
      { id:"SRC-HR",  name:"HR 组织主数据", status:"ok", lastSync:"今晨 06:00" },
    ],
    notifications: [],
    log: [], // 全局事件（含已升级 Issue 的）
  };
  // store 已存在，现在安全填充预置 Issue（mkIssue→ev 会写 store.log）
  store.issues = [
    mkIssue("Fab3-Litho","曝光剂量持续漂移影响良率", -30, "审批中", 1, {
      source:"triage",

/* 决策 #7 · 自动建议题 + 自动排期（在 Issue 转入 已解决 同事务调用）。
   silent=true 用于 seed/批量初始化时不弹 toast、不重复推通知。 */
function createAutoTopic(iss, silent){
  const tid="TPC-"+(++seq.topic);
  const m=findAutoMeeting(occurredAtOf(iss));
  const t={ id:tid, issueId:iss.id, meetingId: m? m.id : null, status:"待汇报",
            scheduledBy:"auto", conclusion:null };
  store.topics.unshift(t); iss.topicIds.push(tid);
  if(m){ if(!m.agenda.includes(tid)) m.agenda.push(tid);
    ev(iss,"自动建议题","系统",`生成 ${tid}，按发生时间自动排期：${meetingLabel(m)}`,true);
  } else {
    ev(iss,"自动建议题","系统",`生成 ${tid}，无可用早会，落「待排期」`,true);
  }
  if(!silent){
    pushNotif("会议主持人", tid, m? `新待汇报：${iss.title}（已自动排期至 ${meetingLabel(m)}）` : `新待汇报：${iss.title}（待排期）`, m? "待汇报清单" : "待排期");
    toast(m? `已生成议题 ${tid} · 自动排期至 ${meetingLabel(m)}` : `已生成议题 ${tid} · 落「待排期」（无可用早会）`);
  }
  return t;
}

/* 决策 #11 · 模拟外部报告服务回调（演示用，真实场景是外部异步 push 进来）。
   forceFail=true 演示失败路径；silent=seed 初始化时不发通知/toast。
   createdBy ∈ {"auto-external","manual-retry"} 区分自动/手动来源。 */
function mockExternalCreateReportDoc(iss, silent, forceFail, createdBy){
  const cb = createdBy || "auto-external";
  let doc = reportDocById(iss.reportDocId);
  if(forceFail){
    // 失败：要么 issue 无 doc 记录（演示"完全没建"），要么有但 status=生成失败
    if(!doc){
      doc = { id:"RPT-"+(++seq.reportDoc), issueId:iss.id, url:null,
              status:"生成失败", createdAt:clockLabel(), lastTriedAt:clockLabel(), createdBy:cb };
      store.reportDocs.unshift(doc); iss.reportDocId = doc.id;
    } else {
      doc.status = "生成失败"; doc.lastTriedAt = clockLabel(); doc.createdBy = cb;
    }
    if(!silent){
      ev(iss,"报告生成失败","系统",`外部报告服务调用失败（${doc.id}）`,true);
      toast(`报告生成失败 · ${doc.id}（可重试）`);
    }
    return doc;
  }
  // 成功：写入/更新 url + status=已生成
  const url = `https://report-svc.example.internal/issues/${iss.id}/edit`;
  if(!doc){
    doc = { id:"RPT-"+(++seq.reportDoc), issueId:iss.id, url,
            status:"已生成", createdAt:clockLabel(), lastTriedAt:clockLabel(), createdBy:cb };
    store.reportDocs.unshift(doc); iss.reportDocId = doc.id;
  } else {
    doc.url = url; doc.status = "已生成"; doc.lastTriedAt = clockLabel(); doc.createdBy = cb;
  }
  if(!silent){
    ev(iss, cb==="manual-retry"?"手动重试报告":"自动建报告","系统",`报告 ${doc.id} 已生成 · ${url}`,true);
    toast(`报告 ${doc.id} 已生成`);
  }
  return doc;
}

/* 决策 #11 · 手动重试报告（owner / 审批经理可点）。Mock 一次外部调用，80% 成功 20% 失败。 */
function retryReportDoc(issueId){
  const iss = issueById(issueId); if(!iss) return;
  const fail = Math.random() < 0.2;
  mockExternalCreateReportDoc(iss, false, fail, "manual-retry");
  render();
  // 抽屉/详情页是独立 DOM 区域；render() 只重绘 main，需要在这里同步重绘抽屉
  if(store.drawerIssueId===issueId && document.getElementById("drawer").classList.contains("open")){
    openIssue(issueId, store.drawerTab || "概览");
  }
}
function mkIssue(site,title,hAgo,status,level,extra){
  const id = "ISS-"+(++seq.issue);
  const owner = RULES.siteOwners[site] || "未分派";
  const chain = RULES.approvalLadder.map((r,i)=>({ level:i+1, role:r, name:roleName(r) }));
  const iss = { id, title, site, owner, status, currentLevel:level||0, approvalChain:chain,
    createdAt:hAgo,
    // 决策 #2 补 · 来源事实字段：'triage'（分诊升级）/ 'external-MES' / 'external-SPC' …
    source:"triage", sourceAlarmId:null,
    events:[], topicIds:[], reportDocId:null, pinned:false,
    desc:"", rootCause:"", affectedLots:[], relatedAlarms:[], params:[], attachments:[],
    // 决策 #10 · 诊断字段（运营字段，标记解决时必填）
    diagnosisSubtype:null, diagnosisDetection:"",
    // 决策 #9 因子层：Kanban、Risk 可覆盖；chartLevel 是上游事实（只读）
    kanban:false, kanbanAuto:false, kanbanOverride:null,
    risk:"低", riskAuto:"低", riskOverride:null,
    chartLevel:"",
    ...(extra||{}) };
  // 自动判 Kanban（lot.priority 规则）；若 extra 未显式覆盖，则采用自动值
  const kAuto = RULES.isKanbanAuto(iss);
  iss.kanbanAuto = kAuto;
  if(iss.kanbanOverride==null) iss.kanban = kAuto;
  // 自动判 Risk（params 越限数）；若 extra 未显式覆盖，则采用自动值
  const rAuto = RULES.riskAuto(iss);
  iss.riskAuto = rAuto;
  if(iss.riskOverride==null) iss.risk = rAuto;
  const srcLabel = iss.source==="triage" ? "由告警升级（或预置）创建"
                 : iss.source && iss.source.startsWith("external-") ? `由外部系统 ${iss.source.slice("external-".length)} 派单创建`
                 : "创建";
  ev(iss,"创建","系统",`${srcLabel}，分派给 ${owner}；自动判定 Kanban=${kAuto?'✓':'✗'} · 风险=${rAuto} · 必须上会=${RULES.mustGoToMeeting(iss)?'✓':'✗'}`,true);
  if(status==="审批中"){ ev(iss,"提交审批",owner,`提交至 ${chain[0].role}`,true); }
  return iss;
}
function roleName(r){ return ({ "三级经理":"刘经理","四级经理":"周经理","五级经理":"吴总" })[r]||r; }

/* mutators / helpers ----------------------------------------- */
function ev(iss,type,actor,text,decision){
  const e={ id:"E-"+(seq.event++), type, actor, text, decision:!!decision, ts:tsNow() };
  iss.events.push(e); store.log.push({ ...e, issueId:iss.id, issueTitle:iss.title });
}
function tsNow(){ const base=8*60+ CLOCK*60 + store_minute(); return clockLabel(); }
let _tick=0; function store_minute(){ return (_tick+=7)%60; }
function clockLabel(){ const total=8*60+CLOCK*60+_tick; const h=Math.floor(total/60)%24; const m=total%60; return `今日 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; }
function pushNotif(role,targetId,text,targetView){ store.notifications.unshift({ id:"N-"+(seq.notif++), role, targetId, text, targetView, read:false, ts:tsNow() }); }
function issueById(id){ return store.issues.find(i=>i.id===id); }
function topicById(id){ return store.topics.find(t=>t.id===id); }
function reportDocById(id){ return id? store.reportDocs.find(d=>d.id===id) : null; }
function reportDocOfIssue(iss){ return iss? reportDocById(iss.reportDocId) : null; }
function meetingById(id){ return store.meetings.find(m=>m.id===id); }

/* ============================================================
   派生层 derive：f(实体 + 规则 + 事件)，无独立生命周期
   ============================================================ */
const derive = {
  triageQueue: ()=> store.alarms.filter(a=>a.status==="未分诊"),
  myIssues: ()=> store.issues.filter(i=>!["已关闭"].includes(i.status)),
  overdue: ()=> store.issues.filter(i=> isOverdue(i) && !["已解决","已关闭"].includes(i.status)),
  escalated: ()=> store.issues.filter(i=> i.status==="审批中" && i.currentLevel>=2),
  myApprovals: ()=> store.issues.filter(i=> i.status==="审批中"),
  // 决策 #7 派生视图：待汇报清单 = 议题已挂会议；待排期 = 议题无会议（自动排期未命中）
  scheduledTopics: ()=> store.topics.filter(t=> t.status==="待汇报" && t.meetingId),
  unscheduledTopics: ()=> store.topics.filter(t=> t.status==="待汇报" && !t.meetingId),
  pendingTopics: ()=> store.topics.filter(t=> t.status==="待汇报"),
  agendaOf: (mid)=> store.topics.filter(t=> t.meetingId===mid),
  unread: (role)=> store.notifications.filter(n=> (role? n.role===role : true) && !n.read),
};
function isOverdue(i){ return (CLOCK*1 - i.createdAt) > RULES.SLA_HOURS && ["处理中","审批中"].includes(i.status); }
function hoursLeft(i){ return Math.round(RULES.SLA_HOURS - (CLOCK - i.createdAt)); }

function setRole(r){ store.role=r; const first=NAV[r][0][0]; store.view=first; document.getElementById("roleSel").value=r; render(); }

function escalate(id){
  const a=store.alarms.find(x=>x.id===id); if(!a) return;
  a.status="已升级";
  const owner=RULES.siteOwners[a.site]||"未分派";
  const id2="ISS-"+(++seq.issue);
  const chain=RULES.approvalLadder.map((r,i)=>({level:i+1,role:r,name:roleName(r)}));
  const iss={ id:id2, title:a.type+"（升级自告警）", site:a.site, owner, status:"处理中", currentLevel:0,
    approvalChain:chain, createdAt:CLOCK,
    source:"triage", sourceAlarmId:a.id,
    events:[], topicIds:[], reportDocId:null, pinned:false,
    desc:"", rootCause:"", affectedLots:[], relatedAlarms:[{id:a.id,type:a.type,time:tsNow()}], params:[], attachments:[],
    diagnosisSubtype:null, diagnosisDetection:"",
    kanban:false, kanbanAuto:false, kanbanOverride:null,
    risk:"低", riskAuto:"低", riskOverride:null,
    chartLevel:"" };
  ev(iss,"创建","你",`由告警 ${a.id} 升级；按注册表分派给 ${owner}；快照审批链 ${chain.map(c=>c.role).join("→")}`,true);
  store.issues.unshift(iss);
  toast(`已创建 ${id2}，分派给 ${owner} → 见 Issue 工作台`);
  render();
}
function ackAlarm(id){ const a=store.alarms.find(x=>x.id===id); a.status="已ack"; toast("已 Ack（写入告警运营字段）"); render(); }
function ignoreAlarm(id){ const a=store.alarms.find(x=>x.id===id); a.status="已忽略"; toast("已标记忽略"); render(); }

/* ---- 2. Issue 工作台（工程师·推进） + 事件时间线抽屉 ---- */
let wbTab="全部", wbIncludeClosed=false;
VIEWS["Issue 工作台"] = ()=>{
  let base = wbIncludeClosed ? store.issues : derive.myIssues();
  let list = base;
  if(wbTab==="超时") list=derive.overdue();
  if(wbTab==="已升级") list=derive.escalated();
  if(wbTab==="必须上会") list=base.filter(i=>mustMeet(i));
  if(wbTab==="Kanban") list=base.filter(i=>i.kanban);
  // 排序：置顶 > 超时 > 其它
  list=[...list].sort((x,y)=> (y.pinned-x.pinned) || (isOverdue(y)-isOverdue(x)));
  const mCount = derive.myIssues().filter(i=>mustMeet(i)).length;
  const kCount = derive.myIssues().filter(i=>i.kanban).length;
  const tab=(t)=>`<button class="tab ${wbTab===t?'active':''}" onclick="wbTab='${t}';render()">${t}${t==='超时'?` (${derive.overdue().length})`:t==='已升级'?` (${derive.escalated().length})`:t==='必须上会'?` (${mCount})`:t==='Kanban'?` (${kCount})`:''}</button>`;
  const rows=list.map(i=>{
    const od=isOverdue(i); const hl=hoursLeft(i);
    // 行内门禁徽：必须上会优先（派生 gate）；否则回退到 Kanban tag（重要度因子的覆盖可见性）
    const gateBadge = mustMeet(i) ? mustMeetTag(i) : kanbanTag(i);
    // 决策 #11 · 报告 badge 仅对必须上会的 Issue 显示（其他 Issue 即便有报告也无操作意义）
    const docBadge = mustMeet(i) ? ` ${reportDocBadge(i,{compact:true})}` : "";
    return `<div class="row ${i.pinned?'pinned':''} clickable" onclick="openIssue('${i.id}')">
      <div class="grow">
        <div class="title">${i.pinned?'📌 ':''}${i.title} ${gateBadge} ${statusTag(i.status)} ${od?`<span class="tag t-danger">已超时</span>`:(hl<=8&&["处理中","审批中"].includes(i.status)?`<span class="tag t-warn">剩 ${hl}h</span>`:"")}${docBadge}</div>
        <div class="sub">${i.id} · ${i.site} · 负责人 ${i.owner}${i.status==="审批中"?` · 审批至 ${i.approvalChain[i.currentLevel-1]?.role||""}`:""}${topicHintSub(i)}</div>
      </div>
      <div class="actions" onclick="event.stopPropagation()">${primaryAction(i)}
        <button class="btn ghost sm" onclick="openIssue('${i.id}')">详情</button>
      </div></div>`;
  }).join("");
  return `
    <div class="pagehead"><h1>Issue 工作台</h1><p>我名下的 Issue，按「需我动作 / 即将超时」自动置顶。每条只暴露当前状态下的<b>那一个</b>主动作。</p></div>
    <div class="hint"><b>必须上会</b>（紫标 · 派生 = Kanban ∧ 子批∈{A,AA,AE} ∧ (主控图=KIP ∨ ACP+风险≥中)）：审批通过自动进「已解决」+ 自动建议题 + 自动排期，上会·成功后自动关闭。📄 角标 = 报告文档状态（决策 #11，1:1 Issue · 外部权威源）。<b>非必须上会</b>：审批通过<b>直接关闭</b>，跳过已解决。详情抽屉「概览」可改 Kanban / Risk 因子（必填理由）。</div>
    <div class="toolbar"><div class="tabs">${tab("全部")}${tab("必须上会")}${tab("Kanban")}${tab("超时")}${tab("已升级")}</div>
      <label class="muted" style="font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:8px"><input type="checkbox" ${wbIncludeClosed?'checked':''} onchange="wbIncludeClosed=this.checked;wbTab='全部';render()"> 含已关闭</label></div>
    <div class="card">${list.length? rows : `<div class="empty">该分类下暂无 Issue</div>`}</div>`;
};
function statusTag(s){ const m={"处理中":"t-info","审批中":"t-purple","已解决":"t-ok","已关闭":"t-gray"}; return `<span class="tag ${m[s]||'t-gray'}">${s}</span>`; }
/* 决策 #9 派生层：必须上会 = f(Kanban, risk, subType, chartLevel)。无独立状态，无独立 override。 */
function mustMeet(i){ return RULES.mustGoToMeeting(i); }
function mustMeetWhy(i){
  const subLot = (i.affectedLots||[]).find(l=>["A","AA","AE"].includes(l.subType));
  const kPart = `Kanban ${i.kanban?'✓':'✗'}`;
  const sPart = subLot ? `子批 ${subLot.subType} ✓` : `子批∈{A,AA,AE} ✗`;
  const cPart = i.chartLevel==="KIP" ? "主控图 KIP ✓"
              : i.chartLevel==="ACP" ? `主控图 ACP+风险${i.risk} ${["中","高"].includes(i.risk)?'✓':'✗'}`
              : `主控图 ${i.chartLevel||'—'} ✗`;
  return `${kPart} · ${sPart} · ${cPart}`;
}
function mustMeetTag(i){
  if(mustMeet(i)) return `<span class="tag t-purple" title="${mustMeetWhy(i)}">必须上会</span>`;
  return "";
}
function riskTag(i){
  const manual = i.riskOverride && i.riskOverride.value===i.risk;
  const cls = i.risk==="高"?"t-danger":i.risk==="中"?"t-warn":"t-gray";
  const tip = manual ? `${i.riskOverride.by} 改：${i.riskOverride.reason}` : '自动 · params 越限数';
  return `<span class="tag ${cls}" title="${tip}">风险:${i.risk}${manual?' · 人工':''}</span>`;
}
function kanbanTag(i){
  const manual = i.kanbanOverride && i.kanbanOverride.value===i.kanban;
  if(i.kanban){
    const tip = manual ? `人工标为 Kanban（${i.kanbanOverride.by}）：${i.kanbanOverride.reason}` : '按 lot.priority==0 自动判定';
    return `<span class="tag t-purple" title="${tip}">Kanban${manual?' · 人工':''}</span>`;
  }
  // 非 Kanban：仅当"自动判 Kanban 但被人工取消"时给灰标，保留可见性；自动非 Kanban 的常态不装饰
  if(i.kanbanAuto && manual){
    const tip = `自动规则判 Kanban，被 ${i.kanbanOverride.by} 取消：${i.kanbanOverride.reason}`;
    return `<span class="tag t-gray" title="${tip}">Kanban 已取消 · 人工</span>`;
  }
  return '';
}
/* 活跃议题：取 topicIds 中最新一条「待汇报」议题（含未排期和已排期），用于行内/抽屉反映进度 */
function activeTopicOf(i){
  return [...i.topicIds].reverse().map(topicById).find(t=>t && t.status==="待汇报");
}
function topicBadgeInline(t){
  if(!t) return "";
  if(t.meetingId){ const m=meetingById(t.meetingId);
    const auto = t.scheduledBy==="auto" ? " · 自动" : " · 人工";
    return `<span class="tag t-info" title="${t.id} · ${m?meetingLabel(m):''}${auto}">排：${m?m.title:t.meetingId}${auto}</span>`;
  }
  return `<span class="tag t-gray" title="${t.id} · 自动排期未命中，等主持人手动排">待排期</span>`;
}
function topicHintSub(i){
  // 已解决只在 必须上会=✓ 路径出现；这里在 sub 行内挂个议题进度小字，避免主动作和 sub 都说同一件事
  if(i.status!=="已解决") return "";
  const t=activeTopicOf(i); if(!t) return "";
  return t.meetingId
    ? ` · 议题 ${t.id} · 排：${meetingLabel(meetingById(t.meetingId))}`
    : ` · 议题 ${t.id} · 等主持人排期`;
}
/* 决策 #11 · 报告文档 mini-badge（可点击跳外部）；失败时显示"重试"提示。 */
function reportDocBadge(iss, opts){
  const d = reportDocOfIssue(iss);
  const compact = opts && opts.compact;
  if(!d){
    return `<span class="tag t-gray" title="该 Issue 尚无报告记录（外部服务未回调或漏建）">📄 报告未生成</span>`;
  }
  if(d.status==="生成失败"){
    return `<span class="tag t-danger" title="${d.id} · 上次尝试：${d.lastTriedAt}">📄 报告生成失败</span>`;
  }
  // 已生成：可点击跳外部
  const label = compact? "📄" : `📄 报告`;
  return `<a class="tag t-ok" href="${d.url}" target="_blank" rel="noopener noreferrer" title="${d.id} · 点击打开外部报告">${label}</a>`;
}
function reportDocRetryBtn(iss){
  const d = reportDocOfIssue(iss);
  if(d && d.status==="已生成") return "";
  return `<button class="btn sm" onclick="retryReportDoc('${iss.id}')">生成报告</button>`;
}
function primaryAction(i){
  if(i.status==="处理中") return `<button class="btn primary sm" onclick="submitApproval('${i.id}')">提交审批</button>`;
  if(i.status==="审批中") return `<span class="tag t-purple">等待 ${i.approvalChain[i.currentLevel-1]?.role||""} 审批</span>`;
  if(i.status==="已解决"){
    /* 决策 #9 · 已解决 是"等上会"相位，只在 必须上会=✓ 路径出现。
       自动建 Report + 自动排期已在 approve 时同事务完成，不再需要"标记解决"或"发起汇报"按钮。 */
    const t=activeTopicOf(i);
    return t ? topicBadgeInline(t) : `<span class="tag t-gray">等议题排期</span>`;
  }
  return "";
}
/* 决策 #10 · 提交审批 = 诊断门禁。审批经理审的就是这份诊断，未填则弹收集弹窗、填好后一并提交。 */
function submitApproval(id){

  pushNotif("审批经理",id,`Issue ${id}「${i.title}」待你审批`,"待我审批");

function submitApprovalPrompt(id){

  `, `<button class="btn primary" onclick="doSubmitApproval('${id}')">填好后提交</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doSubmitApproval(id){
  const sub=document.getElementById("dgSub").value;

/* 处理中/审批后阶段修改诊断：owner + 审批经理可改，与 Kanban/Risk 因子覆盖一致。
   首次填写不必填理由；修订必填理由，落决策事件。 */
function editDiagnosisPrompt(id){
  const i=issueById(id);
  if(i.status==="已关闭"){ toast("已关闭，诊断只读"); return; }
  if(store.role!=="工程师" && store.role!=="审批经理"){ toast("仅 owner / 审批经理可改诊断"); return; }
  const firstFill = !i.diagnosisSubtype && !i.diagnosisDetection;
  const opts = DIAGNOSIS_SUBTYPES.map(v=>`<option value="${v}" ${i.diagnosisSubtype===v?'selected':''}>${v}</option>`).join("");
  drawer(firstFill?"填写诊断":"修改诊断", i.id+" · "+i.title, `

    <div class="sec">诊断子类型（必填 · 受控枚举）</div>

    <div class="sec">检测描述（必填 · ≤200 字）</div>
    <textarea id="dgDet" rows="4" maxlength="200" placeholder="例：FDC 趋势确认能量传感器自上次保养以来标定漂移；复标后剂量回到 30.0±0.3。">${i.diagnosisDetection||''}</textarea>
    ${firstFill?'':`<div class="sec">修订理由（必填 · 落决策事件 body）</div><textarea id="dgReason" rows="3" placeholder="例：复盘后发现初判子类型不准，应为「物料批次」"></textarea>`}
  `, `<button class="btn ok" onclick="doEditDiagnosis('${id}', ${firstFill})">确认</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doEditDiagnosis(id, firstFill){
  const sub=document.getElementById("dgSub").value;
  const det=(document.getElementById("dgDet").value||"").trim();
  if(!sub){ toast("请选择诊断子类型"); return; }
  if(!det){ toast("请填写检测描述"); return; }
  const i=issueById(id);
  if(firstFill){
    i.diagnosisSubtype=sub; i.diagnosisDetection=det;
    ev(i,"填写诊断",store.role,`诊断子类型：${sub}；检测描述：${det}`,true);
    closeDrawer(); toast("已填写诊断"); render();
    if(store.view!=="Issue 详情页") openIssue(id);
  } else {

    if(!reason){ toast("请填写修订理由"); return; }
    const oldSub=i.diagnosisSubtype;
    i.diagnosisSubtype=sub; i.diagnosisDetection=det;
    ev(i,"诊断修订",store.role,`子类型：${oldSub}→${sub}；理由：${reason}`,true);

    if(store.view!=="Issue 详情页") openIssue(id);
  }
}
/* 决策 #4 / #9 · 新状态机不再有"标记解决"与"工程师直关"按钮：

/* ---- Issue 详情：抽屉(裁剪+分页签) 与 整页(全量) 共用同一组区块渲染器 ----

function secMeta(i){

  const rManual = i.riskOverride && i.riskOverride.value===i.risk;
  const rSrc = rManual
    ? `人工覆盖（${i.riskOverride.by} · ${i.riskOverride.at}：${i.riskOverride.reason}）`

    <div class="kv"><b>子批<small class="muted"> · 上游</small></b><span class="muted" style="font-size:12.5px">${subList}（lot.subType，只读）</span></div>

    <div class="kv"><b>负责人</b><span>${i.owner}（按 site→owner 注册表解析）</span></div>

function secChain(i){

function secAnalysis(i){

function secAffected(i){

function secAlarms(i){

function secParams(i){

}
function secAttachments(i){
  if(!i.attachments||!i.attachments.length) return `<div class="empty" style="padding:18px">无附件</div>`;
  return i.attachments.map(f=>`<div class="filerow"><span>📎</span><span class="grow">${f.name}</span><span class="muted">${f.size}</span></div>`).join("");
}
function secTopics(i){
  return i.topicIds.map(tid=>topicById(tid)).filter(Boolean)
    .map(t=>{
      const m = t.meetingId? meetingById(t.meetingId) : null;
      const sched = t.scheduledBy==="auto" ? "自动" : t.scheduledBy==="manual" ? "人工" : "—";
      return `<div class="kv"><b>议题</b><span>${t.id} · ${topicStatusTag(t.status)} · ${m? meetingLabel(m) : "待排期"} <span class="muted" style="font-size:12px">· 排期方式：${sched}</span></span></div>`;
    }).join("")
    || `<div class="muted" style="font-size:12.5px">暂无议题</div>`;
}
/* 决策 #11 · 报告文档区块：外链 + 状态 + 失败/无时显示「生成报告」按钮 */
function secReportDoc(i){
  const canRetry = (store.role==="工程师" || store.role==="审批经理") && i.status!=="已关闭";
  const d = reportDocOfIssue(i);
  if(!d){
    return `<div class="kv"><b>报告</b><span><span class="tag t-gray">未生成</span> <span class="muted" style="font-size:12px">· 外部报告服务未回调或漏建</span>${canRetry? ` <button class="btn sm" style="margin-left:8px" onclick="retryReportDoc('${i.id}')">生成报告</button>`:""}</span></div>`;
  }
  if(d.status==="生成失败"){
    return `<div class="kv"><b>报告</b><span><span class="tag t-danger">生成失败</span> <span class="muted" style="font-size:12px">· ${d.id} · 上次尝试 ${d.lastTriedAt}</span>${canRetry? ` <button class="btn sm" style="margin-left:8px" onclick="retryReportDoc('${i.id}')">重试生成</button>`:""}</span></div>`;
  }
  // 已生成
  const src = d.createdBy==="auto-external" ? "外部自动" : "手动重试";
  return `<div class="kv"><b>报告</b><span><a href="${d.url}" target="_blank" rel="noopener noreferrer" class="tag t-ok" title="点击打开外部报告">📄 ${d.id} · 点击编辑</a> <span class="muted" style="font-size:12px">· ${src} · ${d.lastTriedAt}</span></span></div>`;
}
function secTimeline(i){
  return `<div class="tl">`+[...i.events].reverse().map(e=>`<div class="ev ${e.decision?'decision':''}"><div class="t">${e.type}</div><div class="m">${e.text}</div><div class="ts">${e.actor} · ${e.ts}</div></div>`).join("")+`</div>`;
}
/* 来源（决策 #2 补）：'triage' → 分诊（升级自告警 X）/ 分诊（预置）；'external-*' → 外部派单（系统名）。
   工作台不区分入口，详情里如实标。 */
function sourceLabel(i){
  if(i.source==="triage") return i.sourceAlarmId ? `分诊（升级自告警 ${i.sourceAlarmId}）` : "分诊（预置）";
  if(i.source && i.source.startsWith("external-")) return `外部派单（${i.source.slice("external-".length)}）`;
  return "—";
}
/* 决策 #10 · 诊断字段渲染：结构化结论（不是 comment），未填灰态、填了展示。
   编辑入口落在区块内：owner + 审批经理 可点（已关闭只读）。首次填写不必填理由；修订必填。 */
function secDiagnosis(i){
  const canEdit = (store.role==="工程师" || store.role==="审批经理") && i.status!=="已关闭";
  const filled = !!(i.diagnosisSubtype || i.diagnosisDetection);
  const editBtn = canEdit
    ? `<button class="btn sm" style="margin-left:8px" onclick="editDiagnosisPrompt('${i.id}')">${filled?'改诊断':'填诊断'}</button>`
    : "";
  if(!filled){
    return `<div class="muted" style="font-size:12.5px">待填诊断（「提交审批」时必填——处理中可在此提前填，工作时随手记）${editBtn}</div>`;
  }
  return `<div class="kv"><b>子类型</b><span>${i.diagnosisSubtype?`<span class="tag t-brand">${i.diagnosisSubtype}</span>`:'—'}${editBtn}</span></div>
    <div class="prose" style="margin-top:6px"><b>检测描述：</b>${i.diagnosisDetection||'—'}</div>`;
}

/* 抽屉：内容多 → 分页签(概览/事件/关联/讨论)，每段内再分区；当前主动作常驻底部 */
function openIssue(id, tab){
  const i=issueById(id); if(!i) return;
  tab = tab || "概览";
  store.drawerIssueId = id; store.drawerTab = tab;
  const TABS=["概览","事件","关联"];
  const tabBar=TABS.map(t=>`<button class="tab ${tab===t?'active':''}" onclick="openIssue('${id}','${t}')">${t}</button>`).join("");
  let body="";
  if(tab==="概览"){
    body = secMeta(i)
      + `<div class="sec">问题与根因</div>`+secAnalysis(i)
      + `<div class="sec">工程师诊断（diagnosis_*）</div>`+secDiagnosis(i)
      + `<div class="sec">报告文档（决策 #11）</div>`+secReportDoc(i)
      + `<div class="sec">审批链（创建时快照）</div>`+secChain(i)
      + `<div class="sec">议题历史</div>`+secTopics(i);
  } else if(tab==="事件"){
    body = `<div class="sec">事件时间线（append-only · 只读追溯）</div>`+secTimeline(i);
  } else {
    body = `<div class="sec">受影响批次</div>`+secAffected(i)
      + `<div class="sec">关键参数 / 量测</div>`+secParams(i)
      + `<div class="sec">关联告警</div>`+secAlarms(i)
      + `<div class="sec">附件</div>`+secAttachments(i);
  }
  drawer(`${i.title}`, `${i.id} · ${i.site}`, body, footFor(i), tabBar);
}
function footFor(i){
  let btns="";
  if(store.role==="审批经理" && i.status==="审批中"){
    // 审批经理打开抽屉 → 直接批/驳，无需关闭回列表（批准走 approvePrompt 收可选 comment）
    btns = `<button class="btn ok" onclick="approvePrompt('${i.id}')">批准</button>`
         + `<button class="btn danger" onclick="rejectPrompt('${i.id}')">打回</button>`;
  } else {
    if(i.status==="处理中") btns=`<button class="btn primary" onclick="submitApproval('${i.id}');openIssue('${i.id}')">提交审批</button>`;
    /* 决策 #4 / #9 · 已解决 是 ✓ 路径的"等上会"相位，无主动作（自动建议题 + 自动排期 + 上会成功自动关）。
       审批中由审批经理在批准弹窗里走；✗ 路径不进 已解决，已关闭也无主动作。 */
  }
  return btns
    + `<button class="btn ghost" onclick="openIssuePage('${i.id}')" title="整页可收藏/分享/打印">⤢ 展开为整页</button>`
    + `<button class="btn ghost" onclick="closeDrawer()">关闭</button>`;
}
// 角色感知的行内动作（详情整页工具条复用）
function actionsInline(i){
  if(store.role==="审批经理" && i.status==="审批中")
    return `<button class="btn ok sm" onclick="approvePrompt('${i.id}')">批准</button><button class="btn danger sm" onclick="rejectPrompt('${i.id}')">打回</button>`;
  return primaryAction(i);
}

/* 整页：同一组区块全部展开、不裁剪——独立地址，服务"研究/追溯/分享/打印" */

/* ---- 4. 待我审批（审批经理·whose-turn） ---- */

/* 决策 #5 补 · 批准可选 comment / 打回必填意见：都进 approve/reject 决策事件 body，不新增字段、不新增视图。
   弹窗收意见后再调 approve(id, comment)；打回侧已有 rejectPrompt 走相同模式。 */
function approvePrompt(id){
  const i=issueById(id);
  const cur=i.approvalChain[i.currentLevel-1];
  drawer("批准 Issue", i.id+" · "+i.title, `
    <div class="kv"><b>当前层级</b><span>${cur?.role} · ${cur?.name}（第 ${i.currentLevel}/${i.approvalChain.length} 级）</span></div>
    <div class="sec">批准意见（可选 · 落 approve 事件 body）</div>
    <textarea id="apvTxt" rows="3" placeholder="可空。如需说明放行理由可在此留言；不引入自由 comment 框，仅审批决策的 body。"></textarea>
  `, `<button class="btn ok" onclick="doApprove('${id}')">确认批准</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doApprove(id){
  const txt=(document.getElementById("apvTxt").value||"").trim();
  closeDrawer();
  approve(id, txt);
  // 若仍在审批中（升到下一级），抽屉里继续看新游标；否则视图自然刷新（render 已在 approve 里调）
  const i=issueById(id);
  if(i && i.status==="审批中" && store.role==="审批经理") openIssue(id);
}
function approve(id, comment){
  const i=issueById(id); const cur=i.approvalChain[i.currentLevel-1];
  const cmt = (comment||"").trim();
  const cmtSuffix = cmt ? `；意见：${cmt}` : "";
  ev(i,"审批通过",cur.name,`${cur.role} 批准（第 ${i.currentLevel} 级）${cmtSuffix}`,true);
  if(i.currentLevel < i.approvalChain.length){
    i.currentLevel++;
    toast(`已批准 → 上交 ${i.approvalChain[i.currentLevel-1].role}`);
  } else {
    /* 决策 #4 / #9 · 审批通过自动推进：
       - 必须上会=✓ → 已解决（"等上会"相位）+ 同事务自动建议题并自动排期
       - 必须上会=✗ → 直接 已关闭（跳过 已解决，0 时长不立持久态） */
    if(mustMeet(i)){
      i.status="已解决";
      ev(i,"审批完成","系统","全部层级通过，自动进入「已解决」（等上会相位）",true);
      const t=createAutoTopic(i,true);
      const tail = t.meetingId ? `· 自动排期至 ${meetingLabel(meetingById(t.meetingId))}` : "· 自动排期未命中，落「待排期」";
      pushNotif("工程师",id,`Issue ${id} 审批通过 · 已解决（等上会）${tail}`,"Issue 工作台");
      pushNotif("会议主持人",t.id, t.meetingId? `新待汇报：${i.title}（自动排期 ${meetingLabel(meetingById(t.meetingId))}）` : `新待汇报：${i.title}（待排期）`, t.meetingId? "待汇报清单":"待排期");
      toast(`审批链走完 → 已解决 + 自动建议题 ${t.id} ${tail}`);
    } else {
      i.status="已关闭";
      ev(i,"审批完成","系统","全部层级通过，必须上会=✗ · 自动直关（决策 #9）",true);
      pushNotif("工程师",id,`Issue ${id} 审批通过 · 已自动关闭（非必须上会）`,"Issue 工作台");
      toast("审批链走完 → Issue 已关闭（非必须上会，自动直关）");
    }
  }
  render();
}
function rejectPrompt(id){
  const i=issueById(id);
  drawer("打回 Issue", i.id+" · "+i.title, `
    <div class="kv"><b>当前层级</b><span>${i.approvalChain[i.currentLevel-1]?.role}</span></div>
    <div class="sec">打回意见（必填）</div>
    <textarea id="rejTxt" rows="4" placeholder="例如：缺少 FDC 量测对比数据，请补充后再报。"></textarea>
  `, `<button class="btn danger" onclick="doReject('${id}')">确认打回</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doReject(id){
  const txt=(document.getElementById("rejTxt").value||"").trim();
  if(!txt){ toast("请填写打回意见"); return; }
  const i=issueById(id); const cur=i.approvalChain[i.currentLevel-1];
  i.status="处理中"; i.currentLevel=0; i.pinned=true;
  ev(i,"审批打回",cur.name,`${cur.role} 打回：${txt}`,true);
  pushNotif("工程师",id,`Issue ${id} 被 ${cur.role} 打回：${txt}`,"Issue 工作台");
  closeDrawer(); toast("已打回 → 工程师工作台置顶 + 通知"); render();
}

/* ---- 因子层覆盖（决策 #9）：Kanban / Risk，owner + 审批经理可改、必填理由、落决策事件 ----
   级联（✓→✗ 翻转时）：
   1) 已有「待汇报」议题 → 自动移出（保留历史·meeting.agenda 同步清理）；
      报告文档不动（决策 #11，文档与议题解耦）
   2) Issue 在「已解决」（等上会相位） → 自动关闭——已解决在 ✗ 路径无合法去处，
      不弹"确认关闭"：因子翻转本就必填理由、问责已落人，与"自动推进"哲学一致。 */
function purgePendingTopicsIfDropped(i){
  let removed=0;
  i.topicIds.forEach(tid=>{ const t=topicById(tid); if(t && t.status==="待汇报"){ t.status="移出"; removed++; }});
  store.topics = store.topics.filter(t=>t.status!=="移出");
  store.meetings.forEach(m=>{ m.agenda = m.agenda.filter(tid=>topicById(tid)); });
  return removed;
}
function cascadeOnMustDrop(i){
  const removed = purgePendingTopicsIfDropped(i);
  let autoClosed=false;
  if(i.status==="已解决"){
    i.status="已关闭";
    ev(i,"自动关闭","系统","必须上会 ✓→✗ 翻转：已解决 在 ✗ 路径无合法去处，自动直关（决策 #9 级联）",true);
    autoClosed=true;
  }
  return { removed, autoClosed };
}
function cascadeNote(c){
  if(!c.removed && !c.autoClosed) return "";
  const parts=[];
  if(c.removed) parts.push(`移出 ${c.removed} 条议题`);
  if(c.autoClosed) parts.push("Issue 自动关闭");
  return `（必须上会翻为 ✗ · ${parts.join(' · ')}）`;
}
function toggleKanbanPrompt(id){
  const i=issueById(id); const becoming=!i.kanban;
  drawer((becoming?"标为 Kanban":"取消 Kanban"), i.id+" · "+i.title, `
    <div class="kv"><b>当前</b><span>${i.kanban?'<span class="tag t-purple">Kanban</span>':'<span class="tag t-gray">非 Kanban</span>'} → ${becoming?'<span class="tag t-purple">Kanban</span>':'<span class="tag t-gray">非 Kanban</span>'}</span></div>
    <div class="prose" style="margin-top:8px">Kanban 是重要度信号（hot lot 判定），只是<b>必须上会</b>派生规则的因子之一。改它会重算「必须上会」——若由 ✓ → ✗ 且已有「待汇报」议题，将自动移出（旧议题留痕；报告文档不动）。</div>
    <div class="sec">理由（必填 · 落决策事件）</div>
    <textarea id="kbReason" rows="4" placeholder="${becoming?'例：客户加急批次，业务方口头确认按 Kanban 处理':'例：lot 重排后已无 hot lot，按非 Kanban 处理'}"></textarea>
  `, `<button class="btn primary" onclick="doToggleKanban('${id}')">确认</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doToggleKanban(id){
  const txt=(document.getElementById("kbReason").value||"").trim();
  if(!txt){ toast("请填写理由"); return; }
  const i=issueById(id); const becoming=!i.kanban;
  const wasMust = mustMeet(i);
  i.kanban=becoming;
  i.kanbanOverride={ value:becoming, reason:txt, by:store.role, at:tsNow() };
  ev(i,"Kanban 变更",store.role,`${becoming?'标为':'取消'} Kanban：${txt}（必须上会 ${wasMust?'✓':'✗'}→${mustMeet(i)?'✓':'✗'}）`,true);
  let c={removed:0,autoClosed:false};
  if(wasMust && !mustMeet(i)) c = cascadeOnMustDrop(i);
  closeDrawer();
  toast(`已${becoming?'标为':'取消'} Kanban${cascadeNote(c)}`);
  render();
  if(store.view!=="Issue 详情页") openIssue(id);
}
function toggleRiskPrompt(id){
  const i=issueById(id);
  const opt=(v)=>`<option value="${v}" ${i.risk===v?'selected':''}>${v}</option>`;
  drawer("改风险等级", i.id+" · "+i.title, `
    <div class="kv"><b>当前</b><span>${riskTag(i)} <span class="muted" style="font-size:12px">${i.riskOverride?'人工 · '+i.riskOverride.by:'自动 · params 越限数'}</span></span></div>
    <div class="prose" style="margin-top:8px">Risk 是<b>必须上会</b>派生规则的因子之一（chartLevel=ACP 且 风险∈{中,高} → 满足）。改它会重算「必须上会」——若由 ✓ → ✗ 且已有「待汇报」Report，将自动移出。</div>
    <div class="sec">改为</div>
    <select class="fld" id="riskSel" style="width:160px">${opt("低")}${opt("中")}${opt("高")}</select>
    <div class="sec">理由（必填 · 落决策事件）</div>

function doToggleRisk(id){

function rescheduleTopic(tid){

function doReschedule(tid,newMid){

/* ---- 6. 会议议程（会议主持人·会中）：成功 / 需重排 / 驳回 三结论 ---- */
/* 议程结清自动收尾：会议剩余议程全无「待汇报」议题时，待召开 → 已开。
   触发口径=刚对此会议某条议题做了结论，所以「从未挂过议题的空会议」不会跑到这里。 */
function tryMarkMeetingDone(mid){
  if(!mid) return;
  const m=meetingById(mid);
  if(!m || m.status!=="待召开") return;
  const hasPending=m.agenda.some(tid=>{ const t=topicById(tid); return t && t.status==="待汇报"; });
  if(!hasPending) m.status="已开";
}
let curMeeting=null;
/* 议程行渲染——议程页与「会议管理」抽屉共用 */
function agendaRowHtml(t){
  const i=issueById(t.issueId);

    <div class="actions">

        <button class="btn danger sm" onclick="concludePrompt('${t.id}','驳回')">记：驳回</button>` : `<span class="muted" style="font-size:12.5px">已记录</span>`}
    </div></div>`;

function meetingStatusTag(m){

       : m.status==="取消" ? '<span class="tag t-danger">取消</span>'

VIEWS["会议议程"] = ()=>{
  const today=todayDate();
  const todayAM = store.meetings.find(mm=>+dateOnly(mm.date)===+today && mm.type==="早会");
  const todayPM = store.meetings.find(mm=>+dateOnly(mm.date)===+today && mm.type==="晚会");

function concludeTopic(tid,outcome){
  // 成功 = 无需理由（一键），需重排 / 驳回 走带理由的 concludePrompt
  const t=topicById(tid); const i=issueById(t.issueId);

function concludePrompt(tid,outcome){
  const t=topicById(tid); const i=issueById(t.issueId);
  const isReject = outcome==="驳回";
  drawer(isReject?"记：驳回（评审会判结论不成立）":"记：需重排（议程时间问题）", i.id+" · "+i.title, `
    <div class="prose">${isReject
      ? '决策 #7：<b>驳回 ≠ 需重排</b>——驳回是结论问题（评审会判定结论不成立），Issue 从 已解决 退回 处理中，旧议题标驳回留作历史；复盘后重新走审批 → 新议题。对称于审批驳回 `审批中→处理中`。'
      : '需重排是时间问题（议程没排上 / 临时改期）——新建一条议题留待重新排期，旧议题标需重排留作历史。报告文档不动（决策 #11）。'}</div>
    <div class="sec">${isReject?'驳回意见（必填 · 落决策事件）':'重排说明（可选 · 填了落决策事件）'}</div>
    <textarea id="cReason" rows="4" placeholder="${isReject?'例：根因证据不足，要求工程师补 FDC 趋势对照后再报':'例：今日议程已超时，挪到明日早会（可不填）'}"></textarea>
  `, `<button class="btn ${isReject?'danger':'warn'}" onclick="doConclude('${tid}','${outcome}')">确认${isReject?'驳回':'需重排'}</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doConclude(tid,outcome){
  const txt=(document.getElementById("cReason").value||"").trim();
  // 决策 #7：驳回（结论问题）必填理由；需重排（时间问题）理由可选
  if(outcome==="驳回" && !txt){ toast("请填写驳回意见"); return; }
  const t=topicById(tid); const i=issueById(t.issueId);
  if(outcome==="需重排"){
    t.status="需重排"; t.conclusion=txt? `需重排：${txt}` : "需重排（未填理由）";
    const oldMid=t.meetingId;
    const oldM = oldMid? meetingById(oldMid) : null;
    if(oldM) oldM.agenda = oldM.agenda.filter(x=>x!==tid);
    const nid="TPC-"+(++seq.topic);
    store.topics.unshift({ id:nid, issueId:i.id, meetingId:null, status:"待汇报", scheduledBy:"manual", conclusion:null });
    i.topicIds.push(nid);
    ev(i,"议题重排","会议主持人",`旧 ${tid} 标需重排${txt?`（${txt}）`:'（未填理由）'}；新建 ${nid} 待重新排期`,true);
    pushNotif("会议主持人",nid,`「${i.title}」议题需重排，新建 ${nid} 待排期`,"待排期");
    tryMarkMeetingDone(oldMid);
    closeDrawer();
    toast(`已记需重排 → 新建议题 ${nid}（旧记录保留）`);
  } else if(outcome==="驳回"){
    t.status="驳回"; t.conclusion=`驳回：${txt}`;
    const oldMid=t.meetingId;
    const oldM = oldMid? meetingById(oldMid) : null;
    if(oldM) oldM.agenda = oldM.agenda.filter(x=>x!==tid);
    /* 决策 #7 · 议题驳回：Issue 从 已解决 退回 处理中（对称于审批驳回）。
       新议题待复盘 + 重新走审批 + 重新建议题时再生成；不在驳回当下预建。报告文档不动。 */
    i.status="处理中"; i.pinned=true;
    ev(i,"议题驳回","会议主持人",`议题 ${tid} 驳回：${txt}；Issue 从 已解决 退回 处理中`,true);
    pushNotif("工程师",i.id,`Issue ${i.id} 被评审会驳回：${txt}（需复盘后重走审批）`,"Issue 工作台");
    tryMarkMeetingDone(oldMid);
    closeDrawer();
    toast(`已记驳回 → Issue ${i.id} 退回处理中、工程师工作台置顶`);
  }
  render();
}

/* ---- 6b. 会议管理（会议主持人·Tier-1 CRUD）：月历主视图 + 列表 fallback ----
   决策 #7：早/晚会系统自动滚动建；专题/其他可手动建；禁止删任何已挂议题的 Meeting。 */
let mmFilter="未来";
let mmViewMode="月历"; // 月历 | 列表
let mmMonth=null;      // 月份锚（每月 1 号）
function mmEnsureMonth(){
  if(!mmMonth){ const t=todayDate(); mmMonth=new Date(t.getFullYear(),t.getMonth(),1); }
}
function mmShift(delta){
  mmEnsureMonth();
  mmMonth=new Date(mmMonth.getFullYear(),mmMonth.getMonth()+delta,1);

function mmGoToday(){
  const t=todayDate(); mmMonth=new Date(t.getFullYear(),t.getMonth(),1); render();
}
const _typeOrd = (t)=> t==="早会"?0 : t==="晚会"?1 : t==="专题"?2 : 3;
const _typeShort = (t)=> t==="早会"?"早" : t==="晚会"?"晚" : t==="专题"?"专" : "他";
function _meetingsOn(dstr){
  return store.meetings.filter(m=>fmtYMD(m.date)===dstr)
    .sort((a,b)=>_typeOrd(a.type)-_typeOrd(b.type));
}

VIEWS["会议管理"] = ()=>{
  mmEnsureMonth();
  const modeTabs = `<div class="tabs">
    <button class="tab ${mmViewMode==='月历'?'active':''}" onclick="mmViewMode='月历';render()">月历</button>
    <button class="tab ${mmViewMode==='列表'?'active':''}" onclick="mmViewMode='列表';render()">列表</button></div>`;
  return mmViewMode==="月历" ? renderMmCalendar(modeTabs) : renderMmList(modeTabs);
};

function renderMmCalendar(modeTabs){
  const today=todayDate();
  const ym=`${mmMonth.getFullYear()}年${mmMonth.getMonth()+1}月`;
  const first=new Date(mmMonth.getFullYear(),mmMonth.getMonth(),1);
  const firstWd=(first.getDay()+6)%7; // 0=Mon
  const daysInMonth=new Date(mmMonth.getFullYear(),mmMonth.getMonth()+1,0).getDate();
  const cells=[];
  for(let i=0;i<42;i++){
    const dayNum=i-firstWd+1;
    if(dayNum<1 || dayNum>daysInMonth){ cells.push(null); continue; }
    const d=new Date(mmMonth.getFullYear(),mmMonth.getMonth(),dayNum);
    const dstr=fmtYMD(d);
    const isToday=+d===+today;
    const meetings=_meetingsOn(dstr);
    cells.push({ d, dstr, dayNum, isToday, meetings });
  }
  const weekHead=['一','二','三','四','五','六','日']
    .map(w=>`<div style="font-size:12px;color:var(--ink2);text-align:center;padding:4px 0;font-weight:500">周${w}</div>`).join('');
  const cellHtml=cells.map(c=>{
    if(!c) return `<div style="background:#fafbfd;border-radius:6px;min-height:84px"></div>`;
    const border=c.isToday?'border:2px solid #3b6fde;':'border:1px solid #e6e8ec;';
    const badges=c.meetings.slice(0,4).map(m=>{
      const tone=m.status==='已开'?'#9aa3b2':m.status==='取消'?'#e8665a':'#3b6fde';
      return `<span style="display:inline-block;font-size:11px;padding:1px 5px;border-radius:3px;background:${tone}22;color:${tone};margin-right:3px;margin-bottom:2px">${_typeShort(m.type)}</span>`;
    }).join('');
    const more=c.meetings.length>4?`<span style="font-size:11px;color:var(--ink2)">+${c.meetings.length-4}</span>`:'';
    return `<div onclick="openDayDrawer('${c.dstr}')" style="${border}border-radius:6px;padding:6px;min-height:84px;cursor:pointer;background:#fff">
      <div style="font-size:12px;color:${c.isToday?'#3b6fde':'var(--ink2)'};font-weight:${c.isToday?'600':'400'}">${c.dayNum}${c.isToday?' · 今':''}</div>
      <div style="margin-top:4px;line-height:1.4">${badges}${more}</div>
    </div>`;
  }).join('');
  return `
    <div class="pagehead"><h1>会议管理</h1>
      <p>系统每天自动建周一至周六的早会 + 晚会（不存时分，团队共识）；可手动建专题/其他。已挂议题的不可删（决策 #7）。</p></div>
    <div class="toolbar">
      <button class="btn sm" onclick="mmShift(-1)">←</button>
      <span style="font-weight:600;min-width:110px;text-align:center">${ym}</span>
      <button class="btn sm" onclick="mmShift(1)">→</button>
      <button class="btn sm" onclick="mmGoToday()">今</button>
      <span style="flex:1"></span>
      <button class="btn primary sm" onclick="createMeetingPrompt()">+ 建会议</button>
      ${modeTabs}
    </div>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${weekHead}${cellHtml}</div>
      <div class="muted" style="font-size:12px;margin-top:10px">点格子查看当日会议 · <span style="color:#3b6fde">蓝=待召开</span> · <span style="color:#9aa3b2">灰=已开</span> · <span style="color:#e8665a">红=取消</span> · 早=早会 晚=晚会 专=专题 他=其他</div>
    </div>`;
}

function renderMmList(modeTabs){
  const today=todayDate();
  let list=[...store.meetings].sort((a,b)=>+a.date - +b.date || _typeOrd(a.type)-_typeOrd(b.type));
  if(mmFilter==="未来") list=list.filter(m=>+dateOnly(m.date) >= +today);
  if(mmFilter==="历史") list=list.filter(m=>+dateOnly(m.date) <  +today);
  const tab=(t)=>`<button class="tab ${mmFilter===t?'active':''}" onclick="mmFilter='${t}';render()">${t}</button>`;
  const rows=list.map(m=>{
    const agendaN=m.agenda.length;
    const canDelete = agendaN===0 && m.status!=="已开";
    const reason = m.status==="已开" ? "已开过的 Meeting 不可删（历史不可变）"
                  : agendaN>0 ? `有 ${agendaN} 条议题已挂 · 禁止删（决策 #7）`
                  : "可删";
    return `<div class="row">
      <div class="grow">
        <div class="title">${meetingLabel(m)} · ${m.title} ${meetingStatusTag(m)}</div>
        <div class="sub">${m.id} · 议程 ${agendaN} 条 · ${reason}</div>
      </div>
      <div class="actions">
        <button class="btn sm" onclick="gotoAgenda('${m.id}')">查看议程</button>
        ${m.status==="待召开" && agendaN===0 ? `<button class="btn warn sm" onclick="cancelMeeting('${m.id}')">取消</button>` : ""}
        ${canDelete ? `<button class="btn danger sm" onclick="deleteMeeting('${m.id}')">删除</button>` : `<button class="btn sm" disabled title="${reason}">删除</button>`}
      </div></div>`;
  }).join("");
  return `
    <div class="pagehead"><h1>会议管理</h1>
      <p>系统每天自动建周一至周六的早会 + 晚会（不存时分，团队共识）；可手动建专题/其他。已挂议题的不可删（决策 #7）。</p></div>
    <div class="toolbar"><div class="tabs">${tab("未来")}${tab("历史")}${tab("全部")}</div>
      <button class="btn primary sm" onclick="createMeetingPrompt()">+ 建会议</button>
      <span class="muted">共 ${list.length} 条</span>
      <span style="flex:1"></span>
      ${modeTabs}</div>
    <div class="card">${list.length? rows : `<div class="empty">该范围下无会议</div>`}</div>`;
}

function openDayDrawer(dstr){
  const meetings=_meetingsOn(dstr);
  const rows=meetings.map(m=>{
    const agendaN=m.agenda.length;
    const canDelete = agendaN===0 && m.status!=="已开";
    const reason = m.status==="已开" ? "已开 · 不可删"
                  : agendaN>0 ? `议程 ${agendaN} 条 · 不可删`
                  : "可删";
    return `<div class="row">
      <div class="grow">
        <div class="title">${m.type} · ${m.title} ${meetingStatusTag(m)}</div>
        <div class="sub">${m.id} · 议程 ${agendaN} 条 · ${reason}</div>
      </div>
      <div class="actions">
        <button class="btn sm" onclick="gotoAgenda('${m.id}')">查看议程</button>
        ${m.status==="待召开" && agendaN===0 ? `<button class="btn warn sm" onclick="cancelMeeting('${m.id}');openDayDrawer('${dstr}')">取消</button>` : ""}
        ${canDelete ? `<button class="btn danger sm" onclick="deleteMeeting('${m.id}');openDayDrawer('${dstr}')">删除</button>` : ""}
      </div></div>`;
  }).join('');
  const body = meetings.length ? rows : `<div class="empty">该日暂无会议</div>`;
  drawer(`${dstr} · ${weekdayZh(new Date(dstr+'T00:00:00'))}`,
    `当日共 ${meetings.length} 个会议`,
    body,
    `<button class="btn primary" onclick="createMeetingPrompt('${dstr}')">+ 新建</button>
     <button class="btn ghost" onclick="closeDrawer()">关闭</button>`);
}
function createMeetingPrompt(dateStr){
  const todayStr=dateStr || fmtYMD(todayDate());
  const opts=MEETING_TYPES.map(t=>`<option value="${t}">${t}</option>`).join("");
  drawer("新建会议","由会议主持人手动创建", `
    <div class="prose">早/晚会已被系统自动建（周一至周六）。手动建一般用于<b>专题/其他</b>类型。</div>
    <div class="sec">日期（YYYY-MM-DD）</div>
    <input class="fld" id="mDate" value="${todayStr}" style="width:200px">
    <div class="sec">类型</div>
    <select class="fld" id="mType" style="width:160px">${opts}</select>
    <div class="sec">标题</div>
    <input class="fld" id="mTitle" placeholder="例：CMP 专题复盘会" style="width:300px">
  `, `<button class="btn primary" onclick="doCreateMeeting()">建</button><button class="btn ghost" onclick="closeDrawer()">取消</button>`);
}
function doCreateMeeting(){
  const dStr=document.getElementById("mDate").value;
  const type=document.getElementById("mType").value;
  const title=(document.getElementById("mTitle").value||"").trim() || (weekdayZh(new Date(dStr))+" · "+type);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dStr)){ toast("日期格式应为 YYYY-MM-DD"); return; }
  const d=new Date(dStr+"T00:00:00");
  const slot = type==="早会"?"AM": type==="晚会"?"PM": type==="专题"?"TPC":"OTH";
  const id=`M-${slot}-${dStr}-${seq.event}`;
  store.meetings.push({ id, date:d, type, status:"待召开", title, agenda:[] });
  closeDrawer();
  toast(`已建 ${id} · ${meetingLabel({date:d,type})} · ${title}`);
  render();
}
function gotoAgenda(mid){
  curMeeting=mid; store.view="会议议程"; closeDrawer(); render();
}
function cancelMeeting(mid){
  const m=meetingById(mid);
  if(m.agenda.length>0){ toast("有议题已挂 · 禁止取消"); return; }
  m.status="取消";
  toast(`已取消 ${m.title}`);
  render();
}
function deleteMeeting(mid){
  const m=meetingById(mid);
  if(m.agenda.length>0){ toast("有议题已挂 · 禁止删（决策 #7）"); return; }
  if(m.status==="已开"){ toast("已开过的 Meeting 不可删"); return; }
  store.meetings = store.meetings.filter(x=>x.id!==mid);
  toast(`已删除 ${m.title}`);
  render();
}

/* ---- 7. 接入健康（管理员·派生看板）+ 参考数据 Tier-1 ---- */
VIEWS["接入健康"] = ()=>{
  const src=store.integrationSources.map(s=>`<div class="row">
    <span class="sev ${s.status==='ok'?'low':'high'}"></span>
    <div class="grow"><div class="title">${s.name} ${s.status==='ok'?'<span class="tag t-ok">正常</span>':'<span class="tag t-danger">同步失败</span>'}</div>
      <div class="sub">${s.id} · 最近同步 ${s.lastSync}${s.err?` · <span style="color:var(--danger)">${s.err}</span>`:""}</div></div>
    <div class="actions">${s.status!=='ok'? `<button class="btn primary sm" onclick="retrySync('${s.id}')">重试同步</button>`:`<span class="muted" style="font-size:12.5px">无需处理</span>`}</div>
  </div>`).join("");
  const reg=Object.entries(RULES.siteOwners).map(([site,owner])=>`<div class="row">
    <div class="grow"><div class="title">${site}</div><div class="sub">站点负责人</div></div>
    <div class="actions"><input class="fld" style="width:120px" value="${owner}" onchange="setOwner('${site}',this.value)"></div></div>`).join("");
  return `
    <div class="pagehead"><h1>接入健康</h1><p>管理员入口：上游事实数据同步是否正常。下方参考数据是 Tier-1 CRUD 的主场（改 owner 会影响新 Issue 的分派解析）。</p></div>
    <div class="grid2">
      <div><div class="sec">数据源（事实来源 · 只读同步）</div><div class="card">${src}</div></div>
      <div><div class="sec">参考数据 · site→owner 注册表（Tier-1）</div><div class="card">${reg}</div>
        <div class="sec">审批阶梯（引用数据）</div><div class="card"><div class="row"><div class="grow muted" style="font-size:13px">${RULES.approvalLadder.join(" → ")}</div></div></div></div>
    </div>`;
};
function retrySync(id){ const s=store.integrationSources.find(x=>x.id===id); s.status="ok"; s.lastSync="刚刚"; s.err=null; toast(s.name+" 同步恢复正常"); render(); }
function setOwner(site,val){ RULES.siteOwners[site]=val.trim()||RULES.siteOwners[site]; toast(`已更新 ${site} 负责人 → ${RULES.siteOwners[site]}`); }

/* ---- ★ 通知中心（跨角色） ---- */
VIEWS["通知中心"] = ()=>{
  const list=store.notifications.filter(n=>n.role===store.role);
  const rows=list.map(n=>`<div class="row clickable ${n.read?'':'pinned'}" onclick="openNotif('${n.id}')">
    <span class="sev ${n.read?'low':'high'}"></span>
    <div class="grow"><div class="title">${n.read?'':'<b>● </b>'}${n.text}</div>
      <div class="sub">${n.ts} · 点击直达「${n.targetView}」</div></div>
    <div class="actions"><button class="btn ghost sm" onclick="event.stopPropagation();openNotif('${n.id}')">前往</button></div></div>`).join("");
  return `
    <div class="pagehead"><h1>通知中心</h1><p>跨角色粘合层：聚合「冲着我（${store.role}）来的事」，点任一条直达对应时刻视图并高亮目标项。</p></div>
    <div class="toolbar"><button class="btn sm" onclick="markAllRead()">全部已读</button>
      <span class="muted">当前角色 ${store.role} 未读 ${derive.unread(store.role).length} 条</span></div>
    <div class="card">${list.length? rows : `<div class="empty">没有通知。切换到其他角色操作会在这里产生通知。</div>`}</div>`;
};
function openNotif(id){
  const n=store.notifications.find(x=>x.id===id); n.read=true;
  store.view=n.targetView; render();
  // 高亮目标
  setTimeout(()=>{ flashTarget(n); }, 50);
  toast("已跳转并标记已读");
}
function flashTarget(n){
  // 简化：高亮主区第一张卡片首行（目标项通常已置顶/在列表内）
  const main=document.getElementById("main");
  const rows=main.querySelectorAll(".row");
  for(const r of rows){ if(r.textContent.includes(n.targetId)|| (n.targetId&&r.innerHTML.includes(n.targetId))){ r.classList.add("flash"); r.scrollIntoView({block:"center",behavior:"smooth"}); return; } }
  if(rows[0]) rows[0].classList.add("flash");
}
function markAllRead(){ store.notifications.forEach(n=>{ if(n.role===store.role) n.read=true; }); toast("已全部标记已读"); render(); }

/* ---- ◻ Issue 全表（Tier-1 通用实体表，跨角色） ----
   展示 Tier-1↔Tier-2 的接缝：全量表格浏览/检索（只读为主），
   点任一行进入与 Issue 工作台「同一个」详情抽屉 openIssue()。 */
let tblQ="", tblStatus="全部";
VIEWS["Issue 全表"] = ()=>{
  const all = store.issues; // 全量，含已关闭——与工作台「我名下、未关闭」的过滤口径不同
  const q = tblQ.trim();
  let list = all.filter(i=>{
    const okS = tblStatus==="全部" || i.status===tblStatus;
    const okQ = !q || [i.id,i.title,i.site,i.owner].some(x=>String(x).includes(q));
    return okS && okQ;
  });
  const statuses=["全部","处理中","审批中","已解决","已关闭"];
  const sel = statuses.map(s=>`<option ${tblStatus===s?'selected':''}>${s}</option>`).join("");
  const rows = list.map(i=>{
    const od=isOverdue(i); const hl=hoursLeft(i);
    const sla = od? `<span class="tag t-danger">已超时</span>` : (["处理中","审批中"].includes(i.status)? `${hl}h` : "—");
    const mustCell = mustMeet(i)
      ? `<span class="tag t-purple" title="${mustMeetWhy(i)}">必须上会</span>`
      : `<span class="tag t-gray" title="${mustMeetWhy(i)}">否</span>`;
    return `<tr class="clickable" onclick="openIssue('${i.id}')">
      <td class="mono">${i.id}</td>
      <td>${i.title}</td>
      <td>${mustCell}</td>
      <td>${riskTag(i)}</td>
      <td>${i.site}</td>
      <td>${i.owner}</td>
      <td>${statusTag(i.status)}</td>
      <td>${sla}</td>
      <td style="text-align:center">${i.topicIds.length||"—"}</td>
      <td><button class="btn ghost sm" onclick="event.stopPropagation();openIssue('${i.id}')">详情</button></td>
    </tr>`;
  }).join("");
  return `
    <div class="pagehead"><h1>Issue 全表 <span class="tag t-gray">Tier-1</span></h1>
      <p>通用实体表：全量浏览 / 检索 / 导出，<b>只读为主</b>。和「Issue 工作台」口径不同（这里含已关闭、不按"需我动作"排序）。</p></div>
    <div class="hint">这是 Tier-1↔Tier-2 的接缝演示：表里浏览定位 → 点任一行进入<b>同一个</b> Issue 详情抽屉（与工作台共用），驱动业务的动作在抽屉里完成，表本身不放操作。</div>
    <div class="toolbar">
      <input class="fld" style="width:260px" placeholder="搜索 ID / 标题 / 站点 / 负责人" value="${tblQ}" oninput="tblQ=this.value;render();focusSearch()">
      <select class="fld" style="width:130px" onchange="tblStatus=this.value;render()">${sel}</select>
      <span class="muted">共 ${list.length} / ${all.length} 条</span>
      <button class="btn sm" onclick="toast('演示：导出为 CSV（Tier-1 通用能力）')">导出 CSV</button>
    </div>
    <div class="card" style="overflow:auto">
      <table class="tbl"><thead><tr>
        <th>ID</th><th>标题</th><th>必须上会</th><th>风险</th><th>站点</th><th>负责人</th><th>状态</th><th>时效</th><th>议题</th><th></th>
      </tr></thead><tbody>${list.length? rows : `<tr><td colspan="10"><div class="empty">无匹配记录</div></td></tr>`}</tbody></table>
    </div>`;
};
function focusSearch(){ const el=document.querySelector('#main input'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }

/* ============================================================
   抽屉 / toast / 重置
   ============================================================ */
function drawer(title,sub,bodyHtml,footHtml,tabsHtml){
  const d=document.getElementById("drawer");
  d.innerHTML=`<header><div><h2>${title}</h2><div class="muted" style="font-size:12.5px">${sub}</div></div><button class="x" onclick="closeDrawer()">×</button></header>
    ${tabsHtml?`<div class="dtabs">${tabsHtml}</div>`:""}
    <div class="body">${bodyHtml}</div><div class="foot">${footHtml||""}</div>`;
  d.classList.add("open"); document.getElementById("scrim").classList.add("open");
}
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); store.drawerIssueId=null; store.drawerTab=null; }
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function resetAll(){ seed(); curMeeting=null; wbTab="全部"; closeDrawer(); render(); toast("已重置为初始 mock 数据"); }

/* boot */
seed(); render();
</script>
</body>
